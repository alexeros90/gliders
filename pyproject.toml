[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gliders"
version = "0.1.4"
authors = [
  { name="Alejandro Erostegui", email="alexeros90@gmail.com" },
]
description = "GaLaxy Image DEcontamination Scripts - GLIDErS: Galaxy image cleaning and deblending pipeline"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "photutils",
    "pandas",
    "scikit-image",
    "opencv-python",
    "sep"
]

[project.urls]
Homepage = "https://github.com/alexeros90/gliders"
Repository = "https://github.com/alexeros90/gliders"
Issues = "https://github.com/alexeros90/gliders/issues"

[tool.setuptools.packages.find]
where = ["src"]